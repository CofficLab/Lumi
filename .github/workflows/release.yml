name: Release

on:
  push:
    branches:
      - pre
      - main

concurrency:
  # Stable and preview share one build counter. Serialize both channels so
  # two releases cannot reserve the same Sparkle build number.
  group: release-lumi
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 基础环境变量
  SCHEME: Lumi
  REPO_LINK: "https://github.com/CofficLab/Lumi"
  DESTINATION: "generic/platform=macOS"
  ENTITLEMENTS_PATH: "LumiApp/App.entitlements"
  DERIVED_DATA_PATH: "./DerivedData"
  ArchivePath: "./my-app"
  BuildPath: "./temp"
  RELEASE_ARCHS: "arm64 x86_64"
  DEFAULT_UPDATE_ARCH: "arm64"
  SPARKLE_VERSION: "2.9.1"
  # 客户端 feed 与 DMG 的公开下载根地址。该路径对应 R2 中的 lumi/ 前缀。
  UPDATE_DOWNLOAD_BASE_URL: "https://s.kuaiyizhi.cn/lumi"

  # Secrets
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
  BUILD_CERTIFICATE_P12_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_P12_PASSWORD }}
  APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
  APP_STORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ISSUER_ID }}
  SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY_GITOK }}

jobs:
  release_pipeline:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      # =================================================================================================
      # 1. 版本计算与项目更新
      # =================================================================================================
      - name: Calculate Next Version
        id: version
        run: |
          chmod +x .github/scripts/bump-version.sh
          chmod +x .github/scripts/calculate-version.sh

          # 获取当前版本 (仅用于显示)
          LAST_TAG=$(git tag -l "v*" | sort -V | tail -n 1 2>/dev/null || echo "v0.0.0")
          LAST_TAG="${LAST_TAG#v}"

          # 计算新版本
          NEW_VERSION=$(.github/scripts/calculate-version.sh)
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV

          # 保存上一个标签供 changelog 生成使用
          echo "previous_tag=$LAST_TAG" >> $GITHUB_ENV

          # 输出摘要
          echo "## 📊 版本计算" >> $GITHUB_STEP_SUMMARY
          echo "- **上一个版本**: \`$LAST_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **新版本**: \`$NEW_VERSION\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate Monotonic Date Build Number
        id: build_number
        run: |
          set -euo pipefail

          # Sparkle compares sparkle:version / CFBundleVersion. Use a UTC
          # timestamp so the build number is readable without storing a
          # mutable counter in GitHub or the source tree.
          extract_max() {
            awk -F'[<>]' '/<sparkle:version>/{ value = $3 + 0; if (value > max) max = value } END { print max + 0 }'
          }

          source_max=0
          for file in LumiApp/Config/Lumi-Debug.xcconfig LumiApp/Config/Lumi-Release.xcconfig; do
            if [ -f "$file" ]; then
              value=$(sed -n 's/^CURRENT_PROJECT_VERSION = \([0-9][0-9]*\);/\1/p' "$file" | head -1)
              if [[ "$value" =~ ^[0-9]+$ ]] && (( value > source_max )); then
                source_max=$value
              fi
            fi
          done

          history_max=$(git log --all -p -- \
            appcast.xml appcast-arm64.xml appcast-x86_64.xml \
            appcast-pre.xml appcast-pre-arm64.xml appcast-pre-x86_64.xml \
            | extract_max)

          online_max=0
          stable_feeds=(
            "${{ env.UPDATE_DOWNLOAD_BASE_URL }}/appcast.xml"
            "${{ env.UPDATE_DOWNLOAD_BASE_URL }}/appcast-arm64.xml"
            "${{ env.UPDATE_DOWNLOAD_BASE_URL }}/appcast-x86_64.xml"
          )
          preview_feeds=(
            "${{ env.UPDATE_DOWNLOAD_BASE_URL }}/pre/appcast-pre.xml"
            "${{ env.UPDATE_DOWNLOAD_BASE_URL }}/pre/appcast-pre-arm64.xml"
            "${{ env.UPDATE_DOWNLOAD_BASE_URL }}/pre/appcast-pre-x86_64.xml"
          )

          for url in "${stable_feeds[@]}"; do
            feed=$(curl -fsSL --retry 3 --max-time 20 "$url") || {
              echo "❌ 无法读取稳定版线上 appcast，拒绝继续发布: $url"
              exit 1
            }
            value=$(printf '%s' "$feed" | extract_max)
            if (( value > online_max )); then online_max=$value; fi
          done

          # Preview feeds may not exist yet, but an existing preview build
          # must still participate in the global counter.
          for url in "${preview_feeds[@]}"; do
            if feed=$(curl -fsSL --retry 3 --max-time 20 "$url"); then
              value=$(printf '%s' "$feed" | extract_max)
              if (( value > online_max )); then online_max=$value; fi
            else
              echo "ℹ️ Preview appcast not available, skipping: $url"
            fi
          done

          timestamp_build=$(date -u +%Y%m%d%H%M%S)
          if ! [[ "$timestamp_build" =~ ^[0-9]{14}$ ]]; then
            echo "❌ 无法生成 14 位 UTC 日期构建号: $timestamp_build"
            exit 1
          fi

          known_max=$(printf '%s\n' "$source_max" "$history_max" "$online_max" | sort -n | tail -1)
          if (( timestamp_build > known_max )); then
            new_build="$timestamp_build"
          else
            # Handles clock rollback and the rare case of two releases in the
            # same second without allowing Sparkle's version to go backwards.
            new_build=$((known_max + 1))
            echo "⚠️ UTC 时间构建号不大于已知最大值，使用 $new_build"
          fi

          echo "Known maximum Sparkle build: $known_max"
          echo "Generated Sparkle build: $new_build"
          echo "build_number=$new_build" >> "$GITHUB_ENV"
          echo "build_number=$new_build" >> "$GITHUB_OUTPUT"
          echo "build_floor=$known_max" >> "$GITHUB_ENV"

      - name: Update Lumi Marketing Version
        run: |
          set -euo pipefail

          echo "📝 Updating Lumi MARKETING_VERSION to ${{ env.new_version }}..."

          # build settings 已从 project.pbxproj 迁移到各 App 目录的 xcconfig。
          # 各 app 版本号独立维护：发版只改 Lumi 的 Debug/Release 两个文件，
          # 不再像旧逻辑那样把所有 target 的版本号统一覆盖。
          for f in LumiApp/Config/Lumi-Debug.xcconfig LumiApp/Config/Lumi-Release.xcconfig; do
            sed -i '' "s/^MARKETING_VERSION = .*/MARKETING_VERSION = ${{ env.new_version }};/" "$f"
            if ! grep -q "^MARKETING_VERSION = ${{ env.new_version }};" "$f"; then
              echo "❌ $f 的 MARKETING_VERSION 未更新为 ${{ env.new_version }}"
              exit 1
            fi
          done

          echo "✅ Lumi MARKETING_VERSION 已更新为 ${{ env.new_version }}"

          # Inject the reserved build number only into this CI checkout. The
          # value is embedded in the app but is intentionally not committed.
          for f in LumiApp/Config/Lumi-Debug.xcconfig LumiApp/Config/Lumi-Release.xcconfig; do
            sed -i '' "s/^CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = ${{ env.build_number }};/" "$f"
            if ! grep -q "^CURRENT_PROJECT_VERSION = ${{ env.build_number }};" "$f"; then
              echo "❌ $f 的 CURRENT_PROJECT_VERSION 未注入为 ${{ env.build_number }}"
              exit 1
            fi
          done

          echo "✅ Lumi CURRENT_PROJECT_VERSION 已临时注入为 ${{ env.build_number }}"

      - name: Determine Tag and Prerelease Status
        run: |
          BUILD_VERSION="${{ env.build_number }}"

          if [[ "${{ github.ref }}" == "refs/heads/pre" ]]; then
            TAG_NAME="p${{ env.new_version }}($BUILD_VERSION)"
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "UPDATE_CHANNEL=preview" >> $GITHUB_ENV
            echo "UPDATE_R2_PREFIX=lumi/pre" >> $GITHUB_ENV
            echo "## 🏷️ Tag Info (Pre-release)" >> $GITHUB_STEP_SUMMARY
          else
            TAG_NAME="v${{ env.new_version }}"
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "UPDATE_CHANNEL=stable" >> $GITHUB_ENV
            echo "UPDATE_R2_PREFIX=lumi" >> $GITHUB_ENV
            echo "## 🏷️ Tag Info (Release)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "tag=$TAG_NAME" >> $GITHUB_ENV
          echo "- **Tag**: \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY

      # =================================================================================================
      # 2. 构建与签名
      # =================================================================================================
      - name: Setup macOS signing
        id: signing
        run: |
          chmod +x ./.github/scripts/setup-macos-signing.sh
          source ./.github/scripts/setup-macos-signing.sh
          echo "signing_identity=$SIGNING_IDENTITY" >> $GITHUB_OUTPUT
          echo "team_id=$TEAM_ID" >> $GITHUB_OUTPUT
          echo "api_key_path=$API_KEY_PATH" >> $GITHUB_OUTPUT

      - name: Check Timestamp Service Availability
        run: |
          echo "🔍 Checking Apple timestamp service availability..."
          # Check if we can reach Apple's timestamp server
          for i in {1..3}; do
            if nc -z -w 5 timestamp.apple.com 80 2>/dev/null || \
               nc -z -w 5 ts.apple.com 80 2>/dev/null; then
              echo "✅ Timestamp service is reachable"
              exit 0
            fi
            echo "⚠️  Attempt $i: Timestamp service not reachable, retrying..."
            sleep 2
          done
          echo "⚠️ Timestamp service is not reachable after 3 attempts; continuing and letting codesign validate timestamping"

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Resolve SPM Dependencies
        run: |
          # Clean DerivedData first to avoid any cached dirty state
          rm -rf "${{ env.DERIVED_DATA_PATH }}/SourcePackages"
          mkdir -p "${{ env.DERIVED_DATA_PATH }}/SourcePackages"

          xcodebuild -project ${{ env.SCHEME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -derivedDataPath "${{ env.DERIVED_DATA_PATH }}" \
            -resolvePackageDependencies \
            -skipPackagePluginValidation

      - name: Build App (Archive)
        run: |
          set -euo pipefail
          set -o pipefail
          mkdir -p ./temp

          # Verify SPM packages are resolved
          if [ ! -d "${{ env.DERIVED_DATA_PATH }}/SourcePackages/checkouts" ]; then
            echo "❌ SPM checkouts not found in DerivedData, re-resolving..."
            xcodebuild -project ${{ env.SCHEME }}.xcodeproj \
              -scheme ${{ env.SCHEME }} \
              -derivedDataPath "${{ env.DERIVED_DATA_PATH }}" \
              -resolvePackageDependencies \
              -skipPackagePluginValidation
          fi
          echo "✅ SPM checkouts: $(ls ${{ env.DERIVED_DATA_PATH }}/SourcePackages/checkouts | wc -l | tr -d ' ') packages"

          FIRST_ARCH=true
          for arch in ${{ env.RELEASE_ARCHS }}; do
            echo "🏗️ Archiving ${{ env.SCHEME }} for $arch..."
            rm -rf "./temp/${{ env.SCHEME }}-${arch}.xcarchive"

            # Log xcodebuild output to a file so the full failure context is preserved.
            ARCHIVE_LOG="./temp/archive-${arch}.log"
            set +e
            xcodebuild archive \
              -project ${{ env.SCHEME }}.xcodeproj \
              -scheme ${{ env.SCHEME }} \
              -destination "${{ env.DESTINATION }}" \
              -derivedDataPath "${{ env.DERIVED_DATA_PATH }}" \
              -archivePath "./temp/${{ env.SCHEME }}-${arch}.xcarchive" \
              -configuration Release \
              -skipPackagePluginValidation \
              -skipPackageSignatureValidation \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="-" \
              DEVELOPMENT_TEAM="${{ steps.signing.outputs.team_id }}" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              CODE_SIGNING_REQUIRED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              ARCHS="$arch" \
              ONLY_ACTIVE_ARCH=NO > "$ARCHIVE_LOG" 2>&1
            ARCHIVE_EXIT=$?
            set -e

            if [ $ARCHIVE_EXIT -ne 0 ]; then
              echo "❌ Archive failed for $arch (exit $ARCHIVE_EXIT); tailing log:"
              tail -200 "$ARCHIVE_LOG" || true
              echo ""
              echo "--- error / failure lines ---"
              grep -E "(error:|FAILED|BUILD FAILED|Cannot find)" "$ARCHIVE_LOG" | head -60 || true
              exit 1
            fi

            FIRST_ARCH=false
          done

      - name: Codesign App
        run: |
          set -euo pipefail

          IDENTITY="${{ steps.signing.outputs.signing_identity }}"

          # 使用脚本进行深度签名
          chmod +x .github/scripts/sign_app.sh

          for arch in ${{ env.RELEASE_ARCHS }}; do
            ARCHIVE_APP="./temp/${{ env.SCHEME }}-${arch}.xcarchive/Products/Applications/${{ env.SCHEME }}.app"
            APP_PATH="./temp/${{ env.SCHEME }}-${arch}.app"

            if [ ! -d "$ARCHIVE_APP" ]; then
              echo "❌ Archived app not found: $ARCHIVE_APP"
              exit 1
            fi

            # 从 xcarchive 中提取 App (使用 ditto 保持符号链接和元数据)
            rm -rf "$APP_PATH"
            ditto "$ARCHIVE_APP" "$APP_PATH"

            BINARY_PATH="$APP_PATH/Contents/MacOS/${{ env.SCHEME }}"
            if ! lipo -archs "$BINARY_PATH" | tr ' ' '\n' | grep -qx "$arch"; then
              echo "❌ $BINARY_PATH does not contain expected architecture: $arch"
              lipo -archs "$BINARY_PATH" || true
              exit 1
            fi

            .github/scripts/sign_app.sh "$APP_PATH" "$IDENTITY" "${{ env.ENTITLEMENTS_PATH }}"
          done

      - name: Create DMG
        run: |
          set -euo pipefail

          chmod +x .github/scripts/create-designed-dmg.sh

          for arch in ${{ env.RELEASE_ARCHS }}; do
            VOL_NAME="${{ env.SCHEME }}-${arch}"
            DMG_NAME="./temp/${{ env.SCHEME }}_${{ env.new_version }}_${arch}.dmg"
            APP_PATH="./temp/${{ env.SCHEME }}-${arch}.app"

            if [ ! -d "$APP_PATH" ]; then
              echo "❌ Signed app not found: $APP_PATH"
              exit 1
            fi

            .github/scripts/create-designed-dmg.sh \
              "$APP_PATH" \
              "$DMG_NAME" \
              "$VOL_NAME" \
              ".github/dmg/Lumi-dmg-background.png" \
              "${{ env.SCHEME }}"

            echo "Created: $DMG_NAME"
          done

      - name: Verify Release Build Number
        run: |
          set -euo pipefail

          expected="${{ env.build_number }}"
          floor="${{ env.build_floor }}"

          if ! [[ "$expected" =~ ^[0-9]+$ ]] || ! [[ "$floor" =~ ^[0-9]+$ ]]; then
            echo "❌ 构建号校验输入无效: expected=$expected floor=$floor"
            exit 1
          fi
          if (( expected <= floor )); then
            echo "❌ Sparkle 构建号没有递增: $expected <= $floor"
            exit 1
          fi

          for arch in ${{ env.RELEASE_ARCHS }}; do
            app_path="./temp/${{ env.SCHEME }}-${arch}.app"
            actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Contents/Info.plist")
            if [ "$actual" != "$expected" ]; then
              echo "❌ $arch 的 CFBundleVersion=$actual，预期=$expected"
              exit 1
            fi
            echo "✅ $arch CFBundleVersion=$actual (> $floor)"
          done

      - name: Notary
        run: |
          set -euo pipefail

          if ! compgen -G "./temp/*.dmg" > /dev/null; then
            echo "DMG not found"
            exit 1
          fi

          for file in ./temp/*.dmg; do
            echo "📨 Notarizing $file..."
            result_file="notary_result_$(basename "$file" .dmg).txt"

            # Run submit and capture output
            set +e
            xcrun notarytool submit "$file" \
              --key ${{ steps.signing.outputs.api_key_path }} \
              --key-id=${{ env.APP_STORE_CONNECT_KEY_ID }} \
              --issuer ${{ env.APP_STORE_CONNECT_KEY_ISSUER_ID }} \
              --wait \
              --timeout 10m > "$result_file" 2>&1

            EXIT_CODE=$?
            set -e

            # Output result for debugging
            cat "$result_file"

            if [ $EXIT_CODE -ne 0 ] || grep -q "status: Invalid" "$result_file"; then
               echo "❌ Notarization failed for $file. Retrieving logs..."
               # Extract ID from the output file
               SUBMISSION_ID=$(grep "id:" "$result_file" | sed -n '1p' | awk '{print $2}' | tr -d ' ')
               if [ -n "$SUBMISSION_ID" ]; then
                  echo "Fetching log for Submission ID: $SUBMISSION_ID"
                  xcrun notarytool log "$SUBMISSION_ID" \
                    --key ${{ steps.signing.outputs.api_key_path }} \
                    --key-id=${{ env.APP_STORE_CONNECT_KEY_ID }} \
                    --issuer ${{ env.APP_STORE_CONNECT_KEY_ISSUER_ID }}
               fi
               exit 1
            fi

            stapler staple "$file"
          done

      - name: Validate Notarization
        run: |
          set -euo pipefail
          for file in ./temp/*.dmg; do
            stapler validate "$file"
          done

      - name: Prepare Updates Directory
        run: |
          mkdir updates
          cp ./temp/*.dmg updates/
          ls -alh updates

      # =================================================================================================
      # 2.5 符号文件归档 (dSYM)
      # =================================================================================================
      - name: Package dSYMs
        run: |
          set -euo pipefail

          for arch in ${{ env.RELEASE_ARCHS }}; do
            DSYM_SOURCE="./temp/${{ env.SCHEME }}-${arch}.xcarchive/dSYMs"
            DSYM_ZIP="./temp/${{ env.SCHEME }}_${{ env.new_version }}_${arch}_dSYMs.zip"

            if [ -d "$DSYM_SOURCE" ]; then
              (cd "$DSYM_SOURCE" && zip -r "$GITHUB_WORKSPACE/$DSYM_ZIP" ./*.dSYM)
              echo "✅ dSYMs packaged for $arch: $(du -sh "$DSYM_ZIP" | cut -f1)"
              ls -lh "$DSYM_ZIP"
            else
              echo "⚠️ No dSYMs directory found in xcarchive for $arch"
              ls -R "./temp/${{ env.SCHEME }}-${arch}.xcarchive/" || true
            fi
          done

      # =================================================================================================
      # 2.6 生成 Changelog (供两个通道的 appcast 和 GitHub Release 使用)
      # =================================================================================================
      - name: Generate Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            NOTES="## Preview ${{ env.tag }}\n\nThis preview build was published from the pre branch and may contain unfinished changes."
          else
            PREVIOUS_TAG="${{ env.previous_tag }}"

          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "0.0.0" ]; then
            NOTES="## Release ${{ env.tag }}\n\nInitial release"
          else
            CHANGES=$(git log v${PREVIOUS_TAG}..HEAD --no-merges --pretty=format:'- %s' \
              | grep -Ev '^- (ci|chore|build|style|test|docs)(\(|:)' \
              | grep -Ev '^- 👷 CI:' \
              | sort -u \
              | sed -n '1,20p') || true
            if [ -z "$CHANGES" ]; then
              CHANGES="- Maintenance and stability improvements"
            fi
            NOTES="## Release ${{ env.tag }}\n\n### Changes since v${PREVIOUS_TAG}\n\n${CHANGES}"
          fi
          fi

          echo -e "$NOTES" > changelog.md
          cat changelog.md >> $GITHUB_STEP_SUMMARY

          # 转换为 HTML 供 appcast 使用
          RELEASE_NOTES_HTML=$(gh api markdown -F text=@changelog.md -f mode=gfm)
          echo "RELEASE_NOTES_HTML<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES_HTML" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # 设置 release notes 链接
          RELEASE_NOTES_LINK="${{ env.REPO_LINK }}/releases/tag/${{ env.tag }}"
          echo "RELEASE_NOTES_LINK=$RELEASE_NOTES_LINK" >> $GITHUB_ENV

          echo "✅ Changelog generated and converted to HTML"

      # =================================================================================================
      # 3. Appcast 生成 (按通道分别生成)
      # =================================================================================================
      - name: Generate Appcasts (per-arch)
        run: |
          set -euo pipefail

          chmod +x .github/scripts/install-sparkle-tools.sh
          SPARKLE_BIN="$(SPARKLE_VERSION="${{ env.SPARKLE_VERSION }}" .github/scripts/install-sparkle-tools.sh)"

          if [ ! -x "$SPARKLE_BIN/generate_appcast" ]; then
            echo "❌ Sparkle generate_appcast not found at $SPARKLE_BIN"
            exit 1
          fi

          for arch in ${{ env.RELEASE_ARCHS }}; do
            DMG_FILE="${{ github.workspace }}/updates/${{ env.SCHEME }}_${{ env.new_version }}_${arch}.dmg"
            if [ ! -f "$DMG_FILE" ]; then
              echo "❌ DMG not found for $arch: $DMG_FILE"
              exit 1
            fi

            # 每个架构使用独立目录，避免 generate_appcast 混淆
            APPCAST_INPUT="${{ github.workspace }}/appcast_input_${arch}"
            rm -rf "$APPCAST_INPUT"
            mkdir -p "$APPCAST_INPUT"
            cp "$DMG_FILE" "$APPCAST_INPUT/"

            echo "🔑 Generating appcast for $arch..."
            APPCAST_FILE="$APPCAST_INPUT/appcast.xml"
            echo "${{ env.SPARKLE_PRIVATE_KEY }}" | "$SPARKLE_BIN/generate_appcast" \
              --ed-key-file - \
              -o "$APPCAST_FILE" \
              "$APPCAST_INPUT"

            if [ ! -f "$APPCAST_FILE" ]; then
              echo "❌ Appcast not generated at $APPCAST_FILE"
              ls -la "$APPCAST_INPUT" || true
              exit 1
            fi

            # 替换 enclosure url 为正确的下载链接
            DMG_FILENAME=$(basename "$DMG_FILE")
            DMG_URL_ENCODED=$(echo "$DMG_FILENAME" | sed 's/ /%20/g')
            DOWNLOAD_ROOT="${{ env.UPDATE_DOWNLOAD_BASE_URL }}"
            if [ "${{ env.UPDATE_CHANNEL }}" = "preview" ]; then
              DOWNLOAD_ROOT="$DOWNLOAD_ROOT/pre"
            fi
            DOWNLOAD_URL="$DOWNLOAD_ROOT/$DMG_URL_ENCODED"
            sed -i '' 's|url="[^"]*"|url="'"$DOWNLOAD_URL"'"|g' "$APPCAST_FILE"

            # 注入 release notes HTML 到 appcast
            if [ -n "${RELEASE_NOTES_HTML:-}" ]; then
              export u="$DOWNLOAD_URL"
              export RELEASE_NOTES_HTML
              export RELEASE_NOTES_LINK="${{ env.RELEASE_NOTES_LINK }}"
              
              # 替换 enclosure url
              perl -i -pe 'if (!$done) { s/(enclosure url=")[^"]*/$1.$ENV{u}/e && ($done=1) }' "$APPCAST_FILE"
              
              # 注入 description 和 fullReleaseNotesLink
              perl -i -0777 -pe '
                if (!$done++) {
                  my $notes = $ENV{RELEASE_NOTES_HTML} // "";
                  my $link = $ENV{RELEASE_NOTES_LINK} // "";
                  my $insert = qq{\n            <description><![CDATA[$notes]]></description>\n            <sparkle:fullReleaseNotesLink>$link</sparkle:fullReleaseNotesLink>};
                  s/(<sparkle:minimumSystemVersion>[^<]+<\/sparkle:minimumSystemVersion>)(?!\s*<description)/$1$insert/s;
                }
              ' "$APPCAST_FILE"
              
              echo "✅ Release notes injected for $arch"
            fi

            # Stable keeps the legacy names; preview uses its own names so
            # the two feeds can never overwrite each other.
            if [ "${{ env.UPDATE_CHANNEL }}" = "preview" ]; then
              OUTPUT_APPCAST="${{ github.workspace }}/appcast-pre-${arch}.xml"
            else
              OUTPUT_APPCAST="${{ github.workspace }}/appcast-${arch}.xml"
            fi
            cp "$APPCAST_FILE" "$OUTPUT_APPCAST"

            echo "✅ $(basename "$OUTPUT_APPCAST") generated:"
            cat "$OUTPUT_APPCAST"
          done

          if [ "${{ env.UPDATE_CHANNEL }}" = "preview" ]; then
            cp "${{ github.workspace }}/appcast-pre-${{ env.DEFAULT_UPDATE_ARCH }}.xml" "${{ github.workspace }}/appcast-pre.xml"
          else
            # 兼容旧版本客户端（仍读取 appcast.xml），使用默认架构
            cp "${{ github.workspace }}/appcast-${{ env.DEFAULT_UPDATE_ARCH }}.xml" "${{ github.workspace }}/appcast.xml"
          fi

      - name: Prepare Release Assets
        if: success()
        run: |
          rm -rf release-assets
          mkdir -p release-assets

          if ! compgen -G "./updates/*.dmg" > /dev/null; then
            echo "❌ No DMG found in updates directory"
            exit 1
          fi
          cp ./updates/*.dmg release-assets/

          if [ "${{ env.UPDATE_CHANNEL }}" = "preview" ]; then
            APPCAST_FILES="appcast-pre.xml appcast-pre-arm64.xml appcast-pre-x86_64.xml"
          else
            APPCAST_FILES="appcast.xml appcast-arm64.xml appcast-x86_64.xml"
          fi
          for APPCAST_FILE in $APPCAST_FILES; do
            if [ ! -f "./$APPCAST_FILE" ]; then
              echo "❌ $APPCAST_FILE is required for ${{ env.UPDATE_CHANNEL }} releases"
              exit 1
            fi
            cp "./$APPCAST_FILE" release-assets/
          done

          if compgen -G "./temp/*_dSYMs.zip" > /dev/null; then
            cp ./temp/*_dSYMs.zip release-assets/
          else
            echo "⚠️ dSYM zips not found, continuing without them"
          fi

          ls -alh release-assets

      # =================================================================================================
      # 5.5 上传到 Cloudflare R2
      # =================================================================================================
      - name: Upload to Cloudflare R2
        if: success()
        env:
          WEBHOOK_SECRET: ${{ secrets.COFFIC_APP_UPLOAD_KEY }}
          API_URL: https://data.kuaiyizhi.cn
        run: |
          set -euo pipefail

          # 上传 DMG
          if ! compgen -G "./release-assets/*.dmg" > /dev/null; then
            echo "⚠️  No DMG file found to upload"
          else
            for DMG_FILE in ./release-assets/*.dmg; do
              DMG_FILENAME=$(basename "$DMG_FILE")
              R2_KEY="${{ env.UPDATE_R2_PREFIX }}/${DMG_FILENAME}"

              echo "📤 Uploading DMG to R2: $R2_KEY"

              RESPONSE=$(curl -s -X POST "${API_URL}/lumi/upload" \
                -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
                -F "file=@${DMG_FILE}" \
                -F "key=${R2_KEY}")

              echo "Response: $RESPONSE"

              if echo "$RESPONSE" | grep -q '"success":true'; then
                R2_DMG_URL=$(echo "$RESPONSE" | grep -o '"url":"[^"]*' | cut -d'"' -f4)
                echo "✅ DMG uploaded: $R2_DMG_URL"
              else
                echo "❌ Failed to upload DMG to R2: $DMG_FILENAME"
                exit 1
              fi
            done
          fi

          # 上传当前通道的 appcast
          if [ "${{ env.UPDATE_CHANNEL }}" = "preview" ]; then
            APPCAST_FILES="./release-assets/appcast-pre.xml ./release-assets/appcast-pre-arm64.xml ./release-assets/appcast-pre-x86_64.xml"
          else
            APPCAST_FILES="./release-assets/appcast.xml ./release-assets/appcast-arm64.xml ./release-assets/appcast-x86_64.xml"
          fi
          for APPCAST_FILE in $APPCAST_FILES; do
              if [ -f "$APPCAST_FILE" ]; then
                APPCAST_FILENAME=$(basename "$APPCAST_FILE")
                R2_KEY="${{ env.UPDATE_R2_PREFIX }}/${APPCAST_FILENAME}"

                echo "📤 Uploading appcast to R2: $R2_KEY"

                RESPONSE=$(curl -s -X POST "${API_URL}/lumi/upload" \
                  -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
                  -F "file=@${APPCAST_FILE}" \
                  -F "key=${R2_KEY}")

                echo "Response: $RESPONSE"

                if echo "$RESPONSE" | grep -q '"success":true'; then
                  echo "✅ Appcast uploaded: $R2_KEY"
                else
                  echo "❌ Failed to upload appcast to R2: $APPCAST_FILENAME"
                  exit 1
                fi
              fi
          done

      # =================================================================================================
      # 6. 发布 Release
      # =================================================================================================
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body_path: changelog.md
          files: |
            ./release-assets/*

  rebase:
    if: github.ref == 'refs/heads/main'
    needs:
      - release_pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Check pre branch
        id: check_pre
        run: |
          if git ls-remote --heads origin pre | grep -q pre; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Rebase pre on main
        if: steps.check_pre.outputs.exists == 'true'
        continue-on-error: true
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git fetch origin pre
          git checkout pre
          if ! git rebase origin/main; then
            echo "## Rebase pre on main failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The release completed, but the pre branch could not be rebased automatically." >> "$GITHUB_STEP_SUMMARY"
            echo "Resolve the conflict locally and push pre manually." >> "$GITHUB_STEP_SUMMARY"
            git rebase --abort || true
            exit 1
          fi
          if ! git push origin pre --force-with-lease; then
            echo "## Push pre after rebase failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The release completed, but the rebased pre branch could not be pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
