name: Release

on:
  push:
    branches: [main, pre]

concurrency:
  group: release-lumi
  cancel-in-progress: false

env:
  SCHEME: Lumi
  DESTINATION: generic/platform=macOS
  SPARKLE_VERSION: 2.9.1
  UPDATE_DOWNLOAD_BASE_URL: https://s.kuaiyizhi.cn/lumi
  REPO_LINK: https://github.com/CofficLab/Lumi

jobs:
  prepare:
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      marketing_version: ${{ steps.metadata.outputs.marketing_version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      build_floor: ${{ steps.metadata.outputs.build_floor }}
      tag: ${{ steps.metadata.outputs.tag }}
      channel: ${{ steps.metadata.outputs.channel }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      previous_tag: ${{ steps.metadata.outputs.previous_tag }}
    steps:
      - name: Checkout the triggering source SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: "26.3"
      - name: Prepare immutable release metadata
        id: metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          case "${REF_NAME}" in main) channel=stable ;; pre) channel=preview ;; *) exit 1 ;; esac
          .github/scripts/prepare-release-metadata.sh --channel "${channel}" \
            --source-sha "${SOURCE_SHA}" --run-id "${RUN_ID}" --output release-metadata.json
      - name: Upload immutable release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-metadata-${{ github.run_id }}
          path: release-metadata.json
          retention-days: 14
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [arm64, x86_64]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      DERIVED_DATA_PATH: DerivedData/${{ matrix.arch }}
      SOURCE_PACKAGES_PATH: SourcePackages/${{ matrix.arch }}
      ACP_CACHE_PATH: build/ci-acp-cache/${{ matrix.arch }}
      ACP_SCRATCH_ROOT: build/ci-acp/${{ matrix.arch }}
      ARCHIVE_DIR: temp
    steps:
      - name: Checkout the prepared source SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
      - name: Download immutable release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-metadata-${{ github.run_id }}
          path: release-input
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: "26.3"
      - name: Verify source and inject the prepared version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}"
          .github/scripts/inject-lumi-version.sh release-input/release-metadata.json
          changed="$(git diff --name-only)"
          test "${changed}" = $'LumiApp/Config/Lumi-Debug.xcconfig\nLumiApp/Config/Lumi-Release.xcconfig'
      - name: Compute exact dependency cache key
        id: cache-key
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-package-locks.py \
            Lumi.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            Packages/FactoryLumiACP/Package.resolved
          expected_main=$(python3 -c 'import json; print(json.load(open("release-input/release-metadata.json"))["lock_hashes"]["main"])')
          expected_acp=$(python3 -c 'import json; print(json.load(open("release-input/release-metadata.json"))["lock_hashes"]["acp"])')
          actual_main=$(shasum -a 256 Lumi.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | awk '{print $1}')
          actual_acp=$(shasum -a 256 Packages/FactoryLumiACP/Package.resolved | awk '{print $1}')
          test "${expected_main}" = "${actual_main}" && test "${expected_acp}" = "${actual_acp}"
          toolchain="$(xcodebuild -version | shasum -a 256 | cut -c1-16)-sdk$(xcrun --sdk macosx --show-sdk-version)"
          echo "value=release-spm-v3-${toolchain}-${TARGET_ARCH}-${expected_main}-${expected_acp}" >> "$GITHUB_OUTPUT"
      - name: Restore exact Xcode package cache
        id: xcode-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.SOURCE_PACKAGES_PATH }}
          key: ${{ steps.cache-key.outputs.value }}-xcode
      - name: Restore exact ACP dependency cache
        id: acp-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ACP_CACHE_PATH }}
          key: ${{ steps.cache-key.outputs.value }}-acp
      - name: Strictly resolve locked dependencies
        run: |
          set -euo pipefail
          .github/scripts/resolve-ci-packages.sh Lumi.xcodeproj Lumi "${SOURCE_PACKAGES_PATH}" \
            --derived-data-path "${DERIVED_DATA_PATH}"
          before=$(shasum -a 256 Packages/FactoryLumiACP/Package.resolved | awk '{print $1}')
          mkdir -p "${ACP_CACHE_PATH}" "${ACP_SCRATCH_ROOT}/resolve"
          xcrun swift package --package-path Packages/FactoryLumiACP --cache-path "${ACP_CACHE_PATH}" \
            --scratch-path "${ACP_SCRATCH_ROOT}/resolve" --force-resolved-versions resolve
          after=$(shasum -a 256 Packages/FactoryLumiACP/Package.resolved | awk '{print $1}')
          test "${before}" = "${after}"
      - name: Save complete Xcode package cache
        if: steps.xcode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.SOURCE_PACKAGES_PATH }}
          key: ${{ steps.xcode-cache.outputs.cache-primary-key }}
      - name: Save complete ACP dependency cache
        if: steps.acp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ACP_CACHE_PATH }}
          key: ${{ steps.acp-cache.outputs.cache-primary-key }}
      - name: Archive exactly one architecture
        env:
          DEVELOPMENT_TEAM: Y6HZ9JJYV6
        run: .github/scripts/archive-lumi.sh "${TARGET_ARCH}" "${DEVELOPMENT_TEAM}"
      - name: Verify and package the architecture archive
        run: |
          set -euo pipefail
          .github/scripts/package-release-archive.sh "temp/Lumi-${TARGET_ARCH}.xcarchive" \
            "${TARGET_ARCH}" release-input/release-metadata.json "release-archive-${TARGET_ARCH}"
      - name: Upload architecture archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archive-${{ github.run_id }}-${{ needs.prepare.outputs.build_number }}-${{ matrix.arch }}
          path: release-archive-${{ matrix.arch }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Collect build metrics
        if: always()
        run: .github/scripts/collect-build-metrics.sh --archive-dir temp --output temp/build-metrics-${TARGET_ARCH}.json
      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ matrix.arch }}
          path: |
            temp/archive-${{ matrix.arch }}.log
            temp/results-${{ matrix.arch }}.xcresult
            temp/build-metrics-${{ matrix.arch }}.json
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: [prepare, build]
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_METADATA: release-input/release-metadata.json
      FINAL_ASSETS: final-assets
      RESTORED_ARCHIVES: restored-archives
      ENTITLEMENTS_PATH: LumiApp/App.entitlements
    steps:
      - name: Checkout the prepared source SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - name: Download immutable release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-metadata-${{ github.run_id }}
          path: release-input
      - name: Try to restore an existing final-assets recovery bundle
        id: recovery-download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: final-assets-${{ github.run_id }}-${{ needs.prepare.outputs.build_number }}
          path: final-assets
      - name: Validate recovery state
        id: recovery
        run: |
          set -euo pipefail
          if [ -f "${FINAL_ASSETS}/final-assets-manifest.json" ]; then
            .github/scripts/verify-final-assets.py "${RELEASE_METADATA}" "${FINAL_ASSETS}" "${FINAL_ASSETS}/final-assets-manifest.json"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf "${FINAL_ASSETS}"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download arm64 archive
        if: steps.recovery.outputs.reuse != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archive-${{ github.run_id }}-${{ needs.prepare.outputs.build_number }}-arm64
          path: incoming/arm64
      - name: Download x86_64 archive
        if: steps.recovery.outputs.reuse != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archive-${{ github.run_id }}-${{ needs.prepare.outputs.build_number }}-x86_64
          path: incoming/x86_64
      - name: Setup Xcode
        if: steps.recovery.outputs.reuse != 'true'
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: "26.3"
      - name: Verify and restore both build artifacts
        if: steps.recovery.outputs.reuse != 'true'
        run: .github/scripts/verify-release-inputs.py "${RELEASE_METADATA}" incoming "${RESTORED_ARCHIVES}"
      - name: Setup macOS signing
        id: signing
        if: steps.recovery.outputs.reuse != 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_P12_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_P12_PASSWORD }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail
          source .github/scripts/setup-macos-signing.sh
          echo "signing_identity=${SIGNING_IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "api_key_path=${API_KEY_PATH}" >> "$GITHUB_OUTPUT"
      - name: Sign restored applications
        if: steps.recovery.outputs.reuse != 'true'
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.signing_identity }}
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            source_app="${RESTORED_ARCHIVES}/Lumi-${arch}.xcarchive/Products/Applications/Lumi.app"
            signed_app="temp/Lumi-${arch}.app"
            rm -rf "${signed_app}"; ditto "${source_app}" "${signed_app}"
            .github/scripts/sign_app.sh "${signed_app}" "${SIGNING_IDENTITY}" "${ENTITLEMENTS_PATH}"
            test "$(lipo -archs "${signed_app}/Contents/MacOS/Lumi" | xargs)" = "${arch}"
            test "$(lipo -archs "${signed_app}/Contents/MacOS/lumi-acp" | xargs)" = "${arch}"
          done
      - name: Create uniquely named DMGs
        if: steps.recovery.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${FINAL_ASSETS}"; cp "${RELEASE_METADATA}" "${FINAL_ASSETS}/release-metadata.json"
          for arch in arm64 x86_64; do
            filename=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["dmg_filenames"][sys.argv[2]])' "${RELEASE_METADATA}" "${arch}")
            .github/scripts/create-designed-dmg.sh "temp/Lumi-${arch}.app" "${FINAL_ASSETS}/${filename}" \
              "Lumi-${arch}" .github/dmg/Lumi-dmg-background.png Lumi
          done
      - name: Notarize, staple, and validate DMGs
        if: steps.recovery.outputs.reuse != 'true'
        env:
          API_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            filename=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["dmg_filenames"][sys.argv[2]])' "${RELEASE_METADATA}" "${arch}")
            .github/scripts/notarize-dmg.sh "${FINAL_ASSETS}/${filename}" "${arch}" "notary-records/${arch}.json"
          done
      - name: Prepare release notes and dSYMs
        if: steps.recovery.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.tag }}'
          if [ '${{ needs.prepare.outputs.channel }}' = preview ]; then
            printf '## Preview %s\n\nThis preview build may contain unfinished changes.\n' "${tag}" > "${FINAL_ASSETS}/changelog.md"
          else
            previous='${{ needs.prepare.outputs.previous_tag }}'
            changes=$(git log "v${previous}..${{ needs.prepare.outputs.source_sha }}" --no-merges --pretty=format:'- %s' | grep -Ev '^- (ci|chore|build|style|test|docs)(\(|:)' | sort -u | sed -n '1,20p') || true
            [ -n "${changes}" ] || changes='- Maintenance and stability improvements'
            printf '## Release %s\n\n### Changes since v%s\n\n%s\n' "${tag}" "${previous}" "${changes}" > "${FINAL_ASSETS}/changelog.md"
          fi
          for arch in arm64 x86_64; do
            filename=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["dsym_filenames"][sys.argv[2]])' "${RELEASE_METADATA}" "${arch}")
            test -d "${RESTORED_ARCHIVES}/Lumi-${arch}.xcarchive/dSYMs"
            (cd "${RESTORED_ARCHIVES}/Lumi-${arch}.xcarchive/dSYMs" && zip -qry "$GITHUB_WORKSPACE/${FINAL_ASSETS}/${filename}" .)
          done
      - name: Generate architecture appcasts
        if: steps.recovery.outputs.reuse != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY_GITOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sparkle_bin="$(SPARKLE_VERSION="${SPARKLE_VERSION}" .github/scripts/install-sparkle-tools.sh)"
          notes_html=$(gh api markdown -F text="@${FINAL_ASSETS}/changelog.md" -f mode=gfm)
          channel='${{ needs.prepare.outputs.channel }}'; tag='${{ needs.prepare.outputs.tag }}'
          for arch in arm64 x86_64; do
            filename=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["dmg_filenames"][sys.argv[2]])' "${RELEASE_METADATA}" "${arch}")
            input="appcast-input-${arch}"; rm -rf "${input}"; mkdir "${input}"; cp "${FINAL_ASSETS}/${filename}" "${input}/"
            echo "${SPARKLE_PRIVATE_KEY}" | "${sparkle_bin}/generate_appcast" --ed-key-file - -o "${input}/appcast.xml" "${input}"
            download_root=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["download_root"])' "${RELEASE_METADATA}")
            if [ "${channel}" = preview ]; then output="appcast-pre-${arch}.xml"; else output="appcast-${arch}.xml"; fi
            URL="${download_root}/${filename}" NOTES="${notes_html}" LINK="${REPO_LINK}/releases/tag/${tag}" \
              perl -0777 -pe 's#url="[^"]*"#url="$ENV{URL}"#; s#(<sparkle:minimumSystemVersion>[^<]+</sparkle:minimumSystemVersion>)#$1\n<description><![CDATA[$ENV{NOTES}]]></description>\n<sparkle:fullReleaseNotesLink>$ENV{LINK}</sparkle:fullReleaseNotesLink>#' \
              "${input}/appcast.xml" > "${FINAL_ASSETS}/${output}"
          done
          if [ "${channel}" = preview ]; then cp "${FINAL_ASSETS}/appcast-pre-arm64.xml" "${FINAL_ASSETS}/appcast-pre.xml"; else cp "${FINAL_ASSETS}/appcast-arm64.xml" "${FINAL_ASSETS}/appcast.xml"; fi
      - name: Create immutable final-assets manifest
        if: steps.recovery.outputs.reuse != 'true'
        run: |
          .github/scripts/create-final-assets-manifest.py "${RELEASE_METADATA}" "${FINAL_ASSETS}" "${FINAL_ASSETS}/final-assets-manifest.json" --notary-dir notary-records
          .github/scripts/verify-final-assets.py "${RELEASE_METADATA}" "${FINAL_ASSETS}" "${FINAL_ASSETS}/final-assets-manifest.json"
      - name: Save final-assets recovery artifact before publication
        if: steps.recovery.outputs.reuse != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-assets-${{ github.run_id }}-${{ needs.prepare.outputs.build_number }}
          path: final-assets/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Refuse a stale publish rerun
        run: |
          state_url=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["download_root"]+"/"+d["state_filename"])' "${RELEASE_METADATA}")
          .github/scripts/guard-release-build.py "${RELEASE_METADATA}" \
            --manifest "${FINAL_ASSETS}/final-assets-manifest.json" --state-url "${state_url}" \
            --required-feed "${UPDATE_DOWNLOAD_BASE_URL}/appcast.xml" --required-feed "${UPDATE_DOWNLOAD_BASE_URL}/appcast-arm64.xml" \
            --required-feed "${UPDATE_DOWNLOAD_BASE_URL}/appcast-x86_64.xml" --optional-feed "${UPDATE_DOWNLOAD_BASE_URL}/pre/appcast-pre.xml" \
            --optional-feed "${UPDATE_DOWNLOAD_BASE_URL}/pre/appcast-pre-arm64.xml" --optional-feed "${UPDATE_DOWNLOAD_BASE_URL}/pre/appcast-pre-x86_64.xml"
      - name: Upload immutable DMGs
        env:
          WEBHOOK_SECRET: ${{ secrets.COFFIC_APP_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          prefix=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["r2_prefix"])' "${RELEASE_METADATA}")
          public_root=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["download_root"])' "${RELEASE_METADATA}")
          for arch in arm64 x86_64; do
            filename=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["dmg_filenames"][sys.argv[2]])' "${RELEASE_METADATA}" "${arch}")
            .github/scripts/publish-r2-asset.py "${FINAL_ASSETS}/${filename}" "${prefix}/${filename}" "${public_root}/${filename}"
          done
      - name: Verify public DMG bytes
        run: |
          public_root=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["download_root"])' "${RELEASE_METADATA}")
          .github/scripts/verify-published-assets.py "${RELEASE_METADATA}" "${FINAL_ASSETS}/final-assets-manifest.json" "${public_root}"
      - name: Upload immutable release recovery state
        env:
          WEBHOOK_SECRET: ${{ secrets.COFFIC_APP_UPLOAD_KEY }}
        run: |
          prefix=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["r2_prefix"])' "${RELEASE_METADATA}")
          public_root=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["download_root"])' "${RELEASE_METADATA}")
          state=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["state_filename"])' "${RELEASE_METADATA}")
          .github/scripts/publish-r2-asset.py "${FINAL_ASSETS}/final-assets-manifest.json" "${prefix}/${state}" "${public_root}/${state}"
      - name: Create or verify draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.tag }}'; sha='${{ needs.prepare.outputs.source_sha }}'
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-parse "${tag}^{commit}")" = "${sha}" || { echo "Tag ${tag} already targets another commit" >&2; exit 1; }
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}" 2>/dev/null || true
            remote_sha=$(git rev-parse "${tag}^{commit}")
            test "${remote_sha}" = "${sha}" || { echo "Tag ${tag} points to ${remote_sha}, not ${sha}" >&2; exit 1; }
          else
            prerelease=(); [ '${{ needs.prepare.outputs.is_prerelease }}' = true ] && prerelease=(--prerelease)
            gh release create "${tag}" --draft --target "${sha}" "${prerelease[@]}" --title "${tag}" --notes-file "${FINAL_ASSETS}/changelog.md"
          fi
          mkdir -p existing-assets
          for file in "${FINAL_ASSETS}"/*; do
            name=$(basename "${file}")
            if gh release view "${tag}" --json assets --jq '.assets[].name' | grep -Fqx "${name}"; then
              rm -f "existing-assets/${name}"; gh release download "${tag}" --pattern "${name}" --dir existing-assets
              test "$(shasum -a 256 "${file}" | cut -d' ' -f1)" = "$(shasum -a 256 "existing-assets/${name}" | cut -d' ' -f1)" || exit 1
            else
              gh release upload "${tag}" "${file}"
            fi
          done
      - name: Upload architecture feeds
        env:
          WEBHOOK_SECRET: ${{ secrets.COFFIC_APP_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          prefix=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["r2_prefix"])' "${RELEASE_METADATA}")
          public_root=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["download_root"])' "${RELEASE_METADATA}")
          if [ '${{ needs.prepare.outputs.channel }}' = preview ]; then feeds='appcast-pre-arm64.xml appcast-pre-x86_64.xml'; else feeds='appcast-arm64.xml appcast-x86_64.xml'; fi
          for feed in ${feeds}; do .github/scripts/publish-r2-asset.py --mutable "${FINAL_ASSETS}/${feed}" "${prefix}/${feed}" "${public_root}/${feed}"; done
      - name: Upload legacy feed last
        env:
          WEBHOOK_SECRET: ${{ secrets.COFFIC_APP_UPLOAD_KEY }}
        run: |
          prefix=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["r2_prefix"])' "${RELEASE_METADATA}")
          public_root=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["download_root"])' "${RELEASE_METADATA}")
          if [ '${{ needs.prepare.outputs.channel }}' = preview ]; then feed=appcast-pre.xml; else feed=appcast.xml; fi
          .github/scripts/publish-r2-asset.py --mutable "${FINAL_ASSETS}/${feed}" "${prefix}/${feed}" "${public_root}/${feed}"
      - name: Commit preview fallback feeds
        if: needs.prepare.outputs.channel == 'preview'
        run: .github/scripts/commit-preview-appcasts.sh "${FINAL_ASSETS}" "${RELEASE_METADATA}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit '${{ needs.prepare.outputs.tag }}' --draft=false --target '${{ needs.prepare.outputs.source_sha }}'
      - name: Clean signing credentials
        if: always() && steps.recovery.outputs.reuse != 'true'
        run: |
          security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/build_certificate.p12" "$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

  rebase:
    if: github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase pre on the released main
        continue-on-error: true
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads origin pre >/dev/null || exit 0
          git config user.name 'GitHub Action'; git config user.email 'action@github.com'
          git fetch origin pre; git checkout -B pre origin/pre; git rebase origin/main
          git push origin pre --force-with-lease
