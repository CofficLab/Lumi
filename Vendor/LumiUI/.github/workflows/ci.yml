name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Swift Package Tests
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - name: Show Swift version
        run: swift --version
      - name: Validate package manifest
        run: swift package dump-package
      - name: Run tests
        run: swift test
