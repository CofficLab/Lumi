name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Calculate next version
        id: version
        run: |
          set -euo pipefail
          chmod +x .github/scripts/bump-version.sh .github/scripts/calculate-version.sh

          VERSION_TAGS=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          PREVIOUS_TAG=$(printf '%s\n' "$VERSION_TAGS" | sed '/^$/d' | sort -V | tail -n 1)
          NEW_VERSION=$(.github/scripts/calculate-version.sh)

          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          echo "## 📦 LumiUI Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous version: \`${PREVIOUS_TAG:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- New version: \`$NEW_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate package
        run: |
          swift package dump-package
          swift test

      - name: Generate changelog
        run: |
          set -euo pipefail
          chmod +x .github/scripts/generate-changelog.sh
          .github/scripts/generate-changelog.sh \
            "${{ steps.version.outputs.new_version }}" \
            "${{ steps.version.outputs.previous_tag }}" > changelog.md
          cat changelog.md >> "$GITHUB_STEP_SUMMARY"
          cat changelog.md

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.version.outputs.new_version }}"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: LumiUI ${{ steps.version.outputs.new_version }}
          body_path: changelog.md
          generate_release_notes: false
