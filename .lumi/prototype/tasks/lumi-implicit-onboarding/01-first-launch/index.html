<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>01 首启空态</title>
<style>
  :root{
    --bg:#14151a; --ab-bg:#1b1c22; --rail-bg:#21222a; --panel:#181a1f;
    --raised:#262830; --line:rgba(255,255,255,0.10);
    --text:#ebedf2; --text2:#a7acbb; --text3:#737888;
    --accent:#7c6fff; --green:#30d158; --orange:#ff9f0a;
    --sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;font-family:var(--sans);color:var(--text)}

  .win{width:1280px;height:800px;display:flex;flex-direction:column;background:var(--bg);
    overflow:hidden;position:relative;padding-bottom:28px}
  .titlebar{display:flex;align-items:center;gap:8px;padding:0 13px;height:38px;
    background:rgba(0,0,0,0.24);flex-shrink:0;border-bottom:1px solid rgba(0,0,0,0.2)}
  .tl{width:12px;height:12px;border-radius:50%}
  .tl-r{background:#ff453a}.tl-o{background:#ff9f0a}.tl-g{background:#30d158}
  .title{flex:1;text-align:center;font-size:13px;font-weight:500;color:var(--text2)}

  .body{flex:1;display:flex;min-height:0}

  /* ActivityBar 48pt */
  .ab{width:48px;display:flex;flex-direction:column;align-items:center;padding-top:4px;
    background:var(--ab-bg);flex-shrink:0}
  .ab-item{position:relative;width:48px;height:42px;display:flex;align-items:center;justify-content:center}
  .ab-item svg{width:20px;height:20px;fill:none;stroke:var(--text3);stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .ab-item.on svg{stroke:var(--text)}
  .ab-item.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:3px;height:22px;border-radius:0 2px 2px 0;background:var(--accent)}
  .ab-spacer{flex:1}
  .ab-item.bottom{margin-bottom:4px}

  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

  /* empty state */
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;
    overflow:hidden;padding-top:0}
  .atmos{position:absolute;inset:0;pointer-events:none}
  .atmos .g1{position:absolute;left:50%;top:44%;width:460px;height:460px;margin-left:-230px;margin-top:-230px;
    background:rgba(124,111,255,0.07);border-radius:50%;filter:blur(60px)}
  .atmos .g2{position:absolute;left:50%;top:52%;width:360px;height:360px;margin-left:-180px;margin-top:-180px;
    background:rgba(10,132,255,0.035);border-radius:50%;filter:blur(54px)}

  /* capability motifs row (real: EmptyStateCapabilityBackdrop) */
  .motifs{position:absolute;left:0;right:0;top:52px;display:flex;justify-content:center;gap:46px;
    pointer-events:none}
  .motif{width:92px;height:70px;border:1.5px solid rgba(167,172,187,0.16);border-radius:12px;
    display:flex;align-items:center;justify-content:center;position:relative}
  .motif svg{width:34px;height:34px;fill:none;stroke:rgba(124,111,255,0.24);stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round}
  .motif .row{position:absolute;left:20px;right:20px;bottom:14px;height:1px;
    background:rgba(124,111,255,0.13)}
  .motif .row2{position:absolute;left:20px;width:32px;bottom:24px;height:1px;
    background:rgba(124,111,255,0.13)}
  .motif .pill{position:absolute;left:18px;right:18px;bottom:13px;height:9px;
    border:1px solid rgba(124,111,255,0.13);border-radius:4px}
  .motif .dot{position:absolute;left:21px;bottom:15.5px;width:4px;height:4px;border-radius:50%;
    background:rgba(124,111,255,0.13)}

  .hero{position:relative;margin-top:172px;width:84px;height:84px;display:flex;
    align-items:center;justify-content:center;margin-bottom:18px}
  .hero .halo{position:absolute;inset:0;border-radius:50%;background:rgba(124,111,255,0.085)}
  .hero .ring{position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(124,111,255,0.14)}
  .hero svg{width:40px;height:40px;fill:none;stroke:var(--accent);stroke-width:1.4;
    stroke-linecap:round;stroke-linejoin:round}

  .e-title{position:relative;font-size:20px;font-weight:600;margin-bottom:8px;text-align:center}
  .e-sub{position:relative;font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px}

  .chips{position:relative;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
  .chip{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:16px;
    font-size:12.5px;background:rgba(124,111,255,0.12);border:1px solid rgba(124,111,255,0.24);
    color:var(--text)}
  .chip.additive{background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.16);color:var(--text2)}
  .chip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}

  /* composer */
  .composer-zone{padding:8px 14px 8px;flex-shrink:0;background:var(--bg)}
  .composer{background:var(--raised);border:1px solid var(--line);border-radius:16px;
    padding:10px 12px;box-shadow:0 8px 20px rgba(0,0,0,0.30)}
  .ph{font-size:13px;color:var(--text3);min-height:52px;line-height:1.5}
  .ph.focus{color:var(--text)}
  .bar{display:flex;align-items:center;gap:8px}
  .pill-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;
    background:rgba(255,255,255,0.05);font-size:12px;color:var(--text2)}
  .pill-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .pill-btn .chev{width:9px;height:9px;stroke-width:2}
  .icon-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
  .icon-btn svg{width:16px;height:16px;fill:none;stroke:var(--text3);stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .send{margin-left:auto;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.05);
    display:flex;align-items:center;justify-content:center}
  .send svg{width:11px;height:11px;fill:rgba(255,255,255,0.28);stroke:none}

  .nav{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;
    justify-content:center;gap:6px;background:#0d0e13;border-top:1px solid rgba(255,255,255,0.06);z-index:30}
  .fstep{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;
    font-size:11px;color:var(--text3);background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);text-decoration:none}
  .fstep .n{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.10);
    color:var(--text2);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .fstep.current{background:rgba(124,111,255,0.16);border-color:rgba(124,111,255,0.42);color:var(--text)}
  .fstep.current .n{background:var(--accent);color:#fff}
  .fsep{color:#4a4d58;font-size:10px}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <span class="tl tl-r"></span><span class="tl tl-o"></span><span class="tl tl-g"></span>
    <span class="title">Lumi</span>
  </div>
  <div class="body">
    <div class="ab" data-block="activity-bar" data-block-label="ActivityBar">
      <div class="ab-item on" data-block="ab-chat" data-block-label="Chat 入口">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
    </div>

    <div class="main">
      <div class="empty" data-block="empty-state" data-block-label="空态">
        <div class="atmos">
          <div class="g1"></div><div class="g2"></div>
        </div>

        <div class="motifs" data-block="capability-motifs" data-block-label="能力图案行">
          <div class="motif" data-block="motif-project" data-block-label="项目图案">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <div class="row"></div><div class="row2"></div>
          </div>
          <div class="motif" data-block="motif-creative" data-block-label="创作图案">
            <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
            <div class="row"></div>
          </div>
          <div class="motif" data-block="motif-system" data-block-label="系统图案">
            <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            <div class="pill"></div><div class="dot"></div>
          </div>
          <div class="motif" data-block="motif-web" data-block-label="网络图案">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <div class="pill"></div><div class="dot"></div>
          </div>
        </div>

        <div class="hero" data-block="hero-icon" data-block-label="空态图标">
          <div class="halo"></div><div class="ring"></div>
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>

        <div class="e-title" data-block="empty-title" data-block-label="空态标题">今天想做什么？</div>
        <div class="e-sub" data-block="empty-sub" data-block-label="空态副标题">点一个试试，或直接在下面输入</div>

        <div class="chips" data-block="suggestion-chips" data-block-label="提示词组">
          <div class="chip" data-block="chip-1" data-block-label="提示词 1">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            总结这个项目
          </div>
          <div class="chip" data-block="chip-2" data-block-label="提示词 2">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            查一下最新文档
          </div>
          <div class="chip additive" data-block="chip-add-project" data-block-label="提示词 3：打开项目">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            打开项目
          </div>
        </div>
      </div>

      <div class="composer-zone" data-block="composer" data-block-label="输入区">
        <div class="composer">
          <div class="ph focus" data-block="composer-placeholder" data-block-label="占位文案">输入消息，按 Return 发送…</div>
          <div class="bar">
            <span class="pill-btn" data-block="model-pill" data-block-label="模型选择">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              未选择模型
              <svg class="chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <span class="icon-btn" data-block="attach" data-block-label="附件">
              <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </span>
            <span class="send" data-block="send-button" data-block-label="发送">
              <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav">
    <a class="fstep current" href="#" data-prototype-link="01-first-launch"><span class="n">1</span>首启空态</a>
    <span class="fsep">›</span>
    <a class="fstep" href="#" data-prototype-link="02-first-message-rail-appears"><span class="n">2</span>首条消息</a>
    <span class="fsep">›</span>
    <a class="fstep" href="#" data-prototype-link="03-project-opened"><span class="n">3</span>打开项目</a>
    <span class="fsep">›</span>
    <a class="fstep" href="#" data-prototype-link="04-plugin-discovery"><span class="n">4</span>插件设置</a>
    <span class="fsep">›</span>
    <a class="fstep" href="#" data-prototype-link="05-mature-state"><span class="n">5</span>成熟期</a>
  </div>
</div>
</body>
</html>
