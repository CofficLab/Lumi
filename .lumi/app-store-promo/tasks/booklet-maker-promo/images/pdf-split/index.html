<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>PDF 拆分</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #1a2a5e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 3% 4% 3%;
    }
    .header { text-align: center; margin-bottom: 1.5%; }
    .brand {
      font-size: clamp(12px, 1.4vmin, 20px);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 0.4%;
    }
    h1 {
      font-size: clamp(36px, 6.2vmin, 90px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: clamp(14px, 2vmin, 28px);
      font-weight: 400;
      opacity: 0.65;
      margin-top: 0.8%;
    }
    .visual {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2%;
    }
    .source-doc {
      width: clamp(140px, 16vmin, 220px);
      height: clamp(185px, 22vmin, 300px);
      background: #ffffff;
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      padding: 9% 8%;
      box-shadow: 0 5px 16px rgba(0,0,0,0.22);
      position: relative;
    }
    .source-doc .line {
      height: 2.5px;
      background: #6a7a92;
      border-radius: 1px;
      margin-bottom: 4.5px;
      flex-shrink: 0;
    }
    .source-doc .line:nth-child(odd) { width: 80%; }
    .source-doc .line:nth-child(even) { width: 64%; }
    .source-doc .page-count {
      position: absolute;
      top: 4%;
      right: 4%;
      font-size: clamp(15px, 1.8vmin, 24px);
      color: #1a2a5e;
      font-weight: 700;
      background: #e8ecf4;
      border-radius: 14px;
      padding: 2px 10px;
    }
    .source-doc .doc-label {
      position: absolute;
      bottom: 5%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: clamp(11px, 1.2vmin, 16px);
      color: #5a6a82;
      font-weight: 500;
    }
    .arrow-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .arrow {
      font-size: clamp(36px, 4.5vmin, 62px);
      opacity: 0.5;
      font-weight: 300;
      color: #ffffff;
    }
    .arrow-label {
      font-size: clamp(10px, 1.1vmin, 15px);
      opacity: 0.4;
      white-space: nowrap;
    }
    .split-files {
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 0.8vmin, 10px);
    }
    .split-file {
      width: clamp(155px, 18vmin, 240px);
      height: clamp(55px, 6.5vmin, 88px);
      background: #ffffff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 5% 7%;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
      gap: 8%;
    }
    .split-file:nth-child(2) {
      box-shadow: 0 3px 10px rgba(0,0,0,0.18), 0 0 0 2.5px #4a6fd4;
    }
    .split-file .file-icon {
      width: 24%;
      height: 52%;
      background: #e8ecf4;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .split-file .file-icon svg {
      width: 55%;
      height: 55%;
      fill: #1a2a5e;
    }
    .split-file .file-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .split-file .file-name {
      font-size: clamp(10px, 1.1vmin, 15px);
      color: #1a2a5e;
      font-weight: 600;
    }
    .split-file .file-range {
      font-size: clamp(8px, 0.9vmin, 12px);
      color: #5a6a82;
    }
    .tag {
      text-align: center;
      margin-top: 1.5%;
      font-size: clamp(13px, 1.8vmin, 22px);
      font-weight: 500;
      opacity: 0.5;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <section class="header">
    <div class="brand">BookletMaker</div>
    <h1>PDF 拆分</h1>
    <div class="subtitle">按页码范围，一键拆分成多个文件</div>
  </section>
  <section class="visual">
    <div class="source-doc">
      <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
      <div class="page-count">24 页</div>
      <div class="doc-label">原始文档</div>
    </div>
    <div class="arrow-group">
      <div class="arrow">&gt;</div>
      <div class="arrow-label">按范围拆分</div>
    </div>
    <div class="split-files">
      <div class="split-file">
        <div class="file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM6 20V4h5v7h7v9H6z"/></svg></div>
        <div class="file-info">
          <div class="file-name">第 1-8 页</div>
          <div class="file-range">章节 A</div>
        </div>
      </div>
      <div class="split-file">
        <div class="file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM6 20V4h5v7h7v9H6z"/></svg></div>
        <div class="file-info">
          <div class="file-name">第 9-16 页</div>
          <div class="file-range">章节 B</div>
        </div>
      </div>
      <div class="split-file">
        <div class="file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM6 20V4h5v7h7v9H6z"/></svg></div>
        <div class="file-info">
          <div class="file-name">第 17-24 页</div>
          <div class="file-range">章节 C</div>
        </div>
      </div>
    </div>
  </section>
  <div class="tag">自定义切分点 · 批量导出</div>
</body>
</html>
