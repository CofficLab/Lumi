<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>PDF 拆分</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #1a2a5e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 5% 5% 5%;
    }
    .header { text-align: center; margin-bottom: 2%; }
    .brand {
      font-size: clamp(14px, 1.8vmin, 24px);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 0.5%;
      color: #4A90E2;
    }
    h1 {
      font-size: clamp(48px, 8vmin, 100px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .subtitle {
      font-size: clamp(16px, 2.2vmin, 30px);
      font-weight: 400;
      opacity: 0.85;
      margin-top: 0.6%;
    }
    .visual {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2%;
    }
    .source-doc {
      width: clamp(180px, 20vmin, 280px);
      height: clamp(240px, 28vmin, 380px);
      background: #ffffff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 9% 8%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 20px rgba(74, 144, 226, 0.1);
      position: relative;
    }
    .source-doc .line {
      height: 2.5px;
      background: #6a7a92;
      border-radius: 1px;
      margin-bottom: 4.5px;
      flex-shrink: 0;
    }
    .source-doc .line:nth-child(odd) { width: 80%; }
    .source-doc .line:nth-child(even) { width: 64%; }
    .source-doc .page-count {
      position: absolute;
      top: 4%;
      right: 4%;
      font-size: clamp(16px, 2vmin, 26px);
      color: #1a2a5e;
      font-weight: 700;
      background: #e8ecf4;
      border-radius: 14px;
      padding: 3px 12px;
    }
    .source-doc .doc-label {
      position: absolute;
      bottom: 5%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: clamp(11px, 1.2vmin, 16px);
      color: #5a6a82;
      font-weight: 500;
    }
    .arrow-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .arrow {
      font-size: clamp(44px, 5.5vmin, 72px);
      opacity: 1;
      font-weight: 400;
      color: #4A90E2;
      text-shadow: 0 0 16px rgba(74, 144, 226, 0.6), 0 0 30px rgba(74, 144, 226, 0.3);
    }
    .arrow-label {
      font-size: clamp(12px, 1.4vmin, 18px);
      opacity: 1;
      white-space: nowrap;
      color: #4A90E2;
      font-weight: 600;
    }
    .split-files {
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 0.8vmin, 10px);
    }
    .split-file {
      width: clamp(200px, 22vmin, 300px);
      height: clamp(70px, 8vmin, 110px);
      background: #ffffff;
      border-radius: 7px;
      display: flex;
      align-items: center;
      padding: 5% 7%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      gap: 8%;
    }
    .split-file:nth-child(2) {
      box-shadow: 0 4px 14px rgba(0,0,0,0.25), 0 0 0 3px #4A90E2;
    }
    .split-file .file-icon {
      width: 24%;
      height: 52%;
      background: #e8ecf4;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .split-file .file-icon svg {
      width: 55%;
      height: 55%;
      fill: #1a2a5e;
    }
    .split-file .file-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .split-file .file-name {
      font-size: clamp(12px, 1.3vmin, 17px);
      color: #1a2a5e;
      font-weight: 700;
    }
    .split-file .file-range {
      font-size: clamp(9px, 1vmin, 14px);
      color: #5a6a82;
    }
    .tag {
      text-align: center;
      margin-top: 2.5%;
      font-size: clamp(15px, 2vmin, 26px);
      font-weight: 700;
      opacity: 1;
      letter-spacing: 0.05em;
      color: #4A90E2;
      background: rgba(74, 144, 226, 0.12);
      padding: 10px 28px;
      border-radius: 22px;
      display: inline-block;
      align-self: center;
      border: 1px solid rgba(74, 144, 226, 0.25);
    }
  </style>
</head>
<body>
  <section class="header">
    <div class="brand">BookletMaker</div>
    <h1>PDF 拆分</h1>
    <div class="subtitle">按页码范围，一键拆分成多个文件</div>
  </section>
  <section class="visual">
    <div class="source-doc">
      <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
      <div class="page-count">24 页</div>
      <div class="doc-label">原始文档</div>
    </div>
    <div class="arrow-group">
      <div class="arrow">&gt;</div>
      <div class="arrow-label">按范围拆分</div>
    </div>
    <div class="split-files">
      <div class="split-file">
        <div class="file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM6 20V4h5v7h7v9H6z"/></svg></div>
        <div class="file-info">
          <div class="file-name">第 1-8 页</div>
          <div class="file-range">章节 A</div>
        </div>
      </div>
      <div class="split-file">
        <div class="file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM6 20V4h5v7h7v9H6z"/></svg></div>
        <div class="file-info">
          <div class="file-name">第 9-16 页</div>
          <div class="file-range">章节 B</div>
        </div>
      </div>
      <div class="split-file">
        <div class="file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM6 20V4h5v7h7v9H6z"/></svg></div>
        <div class="file-info">
          <div class="file-name">第 17-24 页</div>
          <div class="file-range">章节 C</div>
        </div>
      </div>
    </div>
  </section>
  <div style="text-align: center;"><div class="tag">自定义切分点 · 批量导出</div></div>
</body>
</html>
