<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>智能拼版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #1a2a5e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 3% 4% 3%;
    }
    .header { text-align: center; margin-bottom: 1.5%; }
    .brand {
      font-size: clamp(12px, 1.4vmin, 20px);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 0.4%;
    }
    h1 {
      font-size: clamp(36px, 6.2vmin, 90px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: clamp(14px, 2vmin, 28px);
      font-weight: 400;
      opacity: 0.65;
      margin-top: 0.8%;
    }
    .visual {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5%;
    }
    .sheet {
      width: clamp(210px, 26vmin, 350px);
      height: clamp(148px, 18vmin, 250px);
      background: #ffffff;
      border-radius: 7px;
      display: flex;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      overflow: hidden;
      position: relative;
    }
    .sheet-cell {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5%;
      position: relative;
      padding: 7%;
    }
    .sheet-cell .line {
      width: 72%;
      height: 2.5px;
      background: #6a7a92;
      border-radius: 1px;
    }
    .sheet-cell .line:nth-child(even) { width: 56%; }
    .page-badge {
      position: absolute;
      bottom: 4%;
      width: clamp(32px, 3.6vmin, 48px);
      height: clamp(32px, 3.6vmin, 48px);
      border-radius: 50%;
      background: #e8ecf4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(13px, 1.5vmin, 20px);
      font-weight: 700;
      color: #1a2a5e;
    }
    .page-badge.left { left: 10%; }
    .page-badge.right { right: 10%; }
    .fold-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2.5px;
      background: repeating-linear-gradient(to bottom, #4a6fd4 0, #4a6fd4 5px, transparent 5px, transparent 10px);
      transform: translateX(-50%);
      z-index: 2;
    }
    .fold-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(10px, 1.1vmin, 15px);
      color: #4a6fd4;
      background: #ffffff;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      z-index: 3;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .sheet-label {
      position: absolute;
      top: 3.5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(10px, 1.1vmin, 14px);
      color: #5a6a82;
      font-weight: 600;
      z-index: 1;
    }
    .tag {
      text-align: center;
      margin-top: 1.5%;
      font-size: clamp(13px, 1.8vmin, 22px);
      font-weight: 500;
      opacity: 0.5;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <section class="header">
    <div class="brand">BookletMaker</div>
    <h1>智能拼版</h1>
    <div class="subtitle">自动计算页面顺序，折叠即成正确页序</div>
  </section>
  <section class="visual">
    <div class="sheet">
      <div class="sheet-label">正面</div>
      <div class="sheet-cell">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
        <div class="page-badge left">8</div>
      </div>
      <div class="sheet-cell">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
        <div class="page-badge right">1</div>
      </div>
      <div class="fold-line"></div>
      <div class="fold-label">折叠线</div>
    </div>
    <div class="sheet">
      <div class="sheet-label">背面</div>
      <div class="sheet-cell">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
        <div class="page-badge left">2</div>
      </div>
      <div class="sheet-cell">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
        <div class="page-badge right">7</div>
      </div>
      <div class="fold-line"></div>
      <div class="fold-label">折叠线</div>
    </div>
  </section>
  <div class="tag">A4 双面打印 · 中间折叠 · 装订成册</div>
</body>
</html>
