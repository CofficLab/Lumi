<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>简洁易用</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #1a2a5e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 3% 4% 3%;
    }
    .header { text-align: center; margin-bottom: 1.5%; }
    .brand {
      font-size: clamp(12px, 1.4vmin, 20px);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 0.4%;
    }
    h1 {
      font-size: clamp(36px, 6.2vmin, 90px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: clamp(14px, 2vmin, 28px);
      font-weight: 400;
      opacity: 0.65;
      margin-top: 0.8%;
    }
    .visual {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2%;
    }
    .drop-zone {
      width: clamp(300px, 38vmin, 500px);
      height: clamp(150px, 19vmin, 250px);
      border: 2.5px dashed rgba(255,255,255,0.2);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2%;
      background: rgba(255,255,255,0.025);
    }
    .drop-icon {
      opacity: 0.5;
    }
    .drop-icon svg {
      width: clamp(36px, 4.5vmin, 58px);
      height: clamp(36px, 4.5vmin, 58px);
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .drop-text {
      font-size: clamp(14px, 1.8vmin, 24px);
      font-weight: 500;
      opacity: 0.55;
    }
    .drop-hint {
      font-size: clamp(10px, 1.2vmin, 15px);
      opacity: 0.3;
    }
    .features {
      display: flex;
      gap: clamp(10px, 1.4vmin, 20px);
      justify-content: center;
    }
    .feature {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2%;
    }
    .feature-icon {
      width: clamp(40px, 5vmin, 64px);
      height: clamp(40px, 5vmin, 64px);
      border-radius: 14px;
      background: rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .feature-icon svg {
      width: 50%;
      height: 50%;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.65;
    }
    .feature-label {
      font-size: clamp(11px, 1.3vmin, 17px);
      font-weight: 500;
      opacity: 0.6;
    }
    .paper-sizes {
      display: flex;
      gap: clamp(12px, 1.8vmin, 24px);
      justify-content: center;
    }
    .paper-size {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8%;
    }
    .paper-box {
      background: rgba(255,255,255,0.07);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(12px, 1.4vmin, 18px);
      font-weight: 600;
      opacity: 0.65;
    }
    .paper-a4 { width: clamp(32px, 3.8vmin, 50px); height: clamp(44px, 5.4vmin, 72px); }
    .paper-a5 { width: clamp(24px, 3vmin, 38px); height: clamp(32px, 4vmin, 52px); }
    .paper-letter { width: clamp(30px, 3.6vmin, 46px); height: clamp(38px, 4.8vmin, 60px); }
    .paper-label {
      font-size: clamp(10px, 1.1vmin, 14px);
      opacity: 0.45;
    }
    .tag {
      text-align: center;
      margin-top: 1.5%;
      font-size: clamp(13px, 1.8vmin, 22px);
      font-weight: 500;
      opacity: 0.5;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <section class="header">
    <div class="brand">BookletMaker</div>
    <h1>简洁易用</h1>
    <div class="subtitle">拖入即用，无需复杂设置</div>
  </section>
  <section class="visual">
    <div class="drop-zone">
      <div class="drop-icon">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
      </div>
      <div class="drop-text">拖入 PDF 文件</div>
      <div class="drop-hint">或点击选择文件</div>
    </div>
    <div class="features">
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </div>
        <div class="feature-label">自动拼版</div>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="feature-label">实时预览</div>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
        </div>
        <div class="feature-label">PDF 拆分</div>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
        <div class="feature-label">自定义设置</div>
      </div>
    </div>
    <div class="paper-sizes">
      <div class="paper-size">
        <div class="paper-box paper-a4">A4</div>
        <div class="paper-label">标准</div>
      </div>
      <div class="paper-size">
        <div class="paper-box paper-a5">A5</div>
        <div class="paper-label">便携</div>
      </div>
      <div class="paper-size">
        <div class="paper-box paper-letter">L</div>
        <div class="paper-label">Letter</div>
      </div>
    </div>
  </section>
  <div class="tag">支持 A4 · A5 · Letter 纸张</div>
</body>
</html>
