<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>小册子制作</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #1a2a5e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 5% 5% 8%;
    }
    .header { text-align: center; margin-bottom: 3%; }
    .brand {
      font-size: clamp(14px, 1.8vmin, 24px);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 0.5%;
      color: #4A90E2;
    }
    h1 {
      font-size: clamp(48px, 8vmin, 100px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .subtitle {
      font-size: clamp(14px, 2vmin, 28px);
      font-weight: 400;
      opacity: 0.5;
      margin-top: 0.8%;
    }
    .visual {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1%;
    }
    .pdf-stack {
      display: flex;
      gap: clamp(4px, 0.6vmin, 10px);
      align-items: flex-end;
    }
    .pdf-page {
      width: clamp(80px, 9.5vmin, 130px);
      height: clamp(110px, 13vmin, 180px);
      background: #ffffff;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      padding: 9% 8%;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      position: relative;
      opacity: 0.75;
    }
    .pdf-page:nth-child(1) { transform: translateY(8px) rotate(-1.5deg); }
    .pdf-page:nth-child(2) { transform: translateY(-6px) rotate(1deg); }
    .pdf-page:nth-child(3) { transform: translateY(4px) rotate(-0.5deg); }
    .pdf-page:nth-child(4) { transform: translateY(-2px) rotate(1.5deg); }
    .pdf-line {
      height: 2.5px;
      background: #6a7a92;
      border-radius: 1px;
      margin-bottom: 4.5px;
      flex-shrink: 0;
    }
    .pdf-line:nth-child(odd) { width: 82%; }
    .pdf-line:nth-child(even) { width: 68%; }
    .pdf-page .page-num {
      margin-top: auto;
      font-size: clamp(11px, 1.2vmin, 16px);
      color: #5a6a82;
      text-align: center;
      font-weight: 600;
      white-space: nowrap;
    }
    .arrow-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .arrow {
      font-size: clamp(40px, 5vmin, 68px);
      opacity: 1;
      font-weight: 400;
      color: #4A90E2;
      text-shadow: 0 0 16px rgba(74, 144, 226, 0.6), 0 0 30px rgba(74, 144, 226, 0.3);
    }
    .arrow-label {
      font-size: clamp(12px, 1.4vmin, 18px);
      opacity: 1;
      color: #ffffff;
      font-weight: 700;
      white-space: nowrap;
      background: #4A90E2;
      padding: 5px 16px;
      border-radius: 16px;
      border: none;
      box-shadow: 0 2px 8px rgba(74, 144, 226, 0.4);
    }
    .booklet {
      width: clamp(240px, 28vmin, 380px);
      height: clamp(165px, 20vmin, 275px);
      background: linear-gradient(145deg, #ffffff 0%, #f0f2f8 100%);
      border-radius: 8px 14px 14px 8px;
      display: flex;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 0 24px rgba(74, 144, 226, 0.15), inset -2px 0 6px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }
    .booklet::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 5%;
      bottom: 5%;
      width: 3px;
      background: linear-gradient(to bottom, transparent, #4A90E2, transparent);
      transform: translateX(-50%);
    }
    .booklet::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(to right, #c8ccd8, transparent);
      border-radius: 7px 0 0 7px;
    }
    .booklet-page {
      flex: 1;
      padding: 8% 7%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .booklet-page .line {
      height: 2.5px;
      background: #6a7a92;
      border-radius: 1px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .booklet-page .line:nth-child(odd) { width: 75%; }
    .booklet-page .line:nth-child(even) { width: 60%; }
    .tag {
      text-align: center;
      margin-top: 3%;
      font-size: clamp(14px, 2vmin, 24px);
      font-weight: 700;
      opacity: 1;
      letter-spacing: 0.05em;
      color: #4A90E2;
      background: rgba(74, 144, 226, 0.12);
      padding: 8px 24px;
      border-radius: 20px;
      display: inline-block;
      align-self: center;
      border: 1px solid rgba(74, 144, 226, 0.25);
    }
  </style>
</head>
<body>
  <section class="header">
    <div class="brand">BookletMaker</div>
    <h1>小册子制作</h1>
    <div class="subtitle">普通 PDF 一键转为可装订小册子</div>
  </section>
  <section class="visual">
    <div class="pdf-stack">
      <div class="pdf-page">
        <div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div>
        <div class="page-num">第 1 页</div>
      </div>
      <div class="pdf-page">
        <div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div>
        <div class="page-num">第 2 页</div>
      </div>
      <div class="pdf-page">
        <div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div>
        <div class="page-num">第 3 页</div>
      </div>
      <div class="pdf-page">
        <div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div>
        <div class="page-num">第 4 页</div>
      </div>
    </div>
    <div class="arrow-group">
      <div class="arrow">→</div>
      <div class="arrow-label">自动拼版</div>
    </div>
    <div class="booklet">
      <div class="booklet-page">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
      </div>
      <div class="booklet-page">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
      </div>
    </div>
  </section>
  <div style="text-align: center;"><div class="tag">拖入 PDF · 自动拼版 · 双面打印</div></div>
</body>
</html>
