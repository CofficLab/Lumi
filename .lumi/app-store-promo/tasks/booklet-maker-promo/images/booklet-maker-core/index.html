<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>小册子制作</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #1a2a5e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 3% 4% 3%;
    }
    .header { text-align: center; margin-bottom: 1.5%; }
    .brand {
      font-size: clamp(12px, 1.4vmin, 20px);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 0.4%;
    }
    h1 {
      font-size: clamp(36px, 6.2vmin, 90px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: clamp(14px, 2vmin, 28px);
      font-weight: 400;
      opacity: 0.65;
      margin-top: 0.8%;
    }
    .visual {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5%;
    }
    .pdf-stack {
      display: flex;
      gap: clamp(4px, 0.6vmin, 10px);
      align-items: flex-end;
    }
    .pdf-page {
      width: clamp(90px, 10.5vmin, 145px);
      height: clamp(120px, 14vmin, 195px);
      background: #ffffff;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      padding: 9% 8%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.22);
      position: relative;
    }
    .pdf-page:nth-child(2) { transform: translateY(-5px); }
    .pdf-page:nth-child(3) { transform: translateY(-3px); }
    .pdf-line {
      height: 2.5px;
      background: #6a7a92;
      border-radius: 1px;
      margin-bottom: 4.5px;
      flex-shrink: 0;
    }
    .pdf-line:nth-child(odd) { width: 82%; }
    .pdf-line:nth-child(even) { width: 68%; }
    .pdf-page .page-num {
      margin-top: auto;
      font-size: clamp(11px, 1.2vmin, 16px);
      color: #5a6a82;
      text-align: center;
      font-weight: 600;
      white-space: nowrap;
    }
    .arrow-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .arrow {
      font-size: clamp(36px, 4.5vmin, 62px);
      opacity: 0.5;
      font-weight: 300;
      color: #ffffff;
    }
    .arrow-label {
      font-size: clamp(10px, 1.1vmin, 15px);
      opacity: 0.4;
      white-space: nowrap;
    }
    .booklet {
      width: clamp(200px, 24vmin, 330px);
      height: clamp(145px, 17vmin, 235px);
      background: linear-gradient(145deg, #ffffff 0%, #f5f6fa 100%);
      border-radius: 7px 12px 12px 7px;
      display: flex;
      box-shadow: 0 10px 32px rgba(0,0,0,0.32), inset -2px 0 5px rgba(0,0,0,0.04);
      position: relative;
      overflow: hidden;
    }
    .booklet::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 5%;
      bottom: 5%;
      width: 2px;
      background: linear-gradient(to bottom, transparent, #b8c0d4, transparent);
      transform: translateX(-50%);
    }
    .booklet::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(to right, #c8ccd8, transparent);
      border-radius: 7px 0 0 7px;
    }
    .booklet-page {
      flex: 1;
      padding: 8% 7%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .booklet-page .line {
      height: 2.5px;
      background: #6a7a92;
      border-radius: 1px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .booklet-page .line:nth-child(odd) { width: 78%; }
    .booklet-page .line:nth-child(even) { width: 62%; }
    .tag {
      text-align: center;
      margin-top: 1.5%;
      font-size: clamp(13px, 1.8vmin, 22px);
      font-weight: 500;
      opacity: 0.5;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <section class="header">
    <div class="brand">BookletMaker</div>
    <h1>小册子制作</h1>
    <div class="subtitle">普通 PDF 一键转为可装订小册子</div>
  </section>
  <section class="visual">
    <div class="pdf-stack">
      <div class="pdf-page">
        <div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div>
        <div class="page-num">第 1 页</div>
      </div>
      <div class="pdf-page">
        <div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div>
        <div class="page-num">第 2 页</div>
      </div>
      <div class="pdf-page">
        <div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div>
        <div class="page-num">第 3 页</div>
      </div>
      <div class="pdf-page">
        <div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div>
        <div class="page-num">第 4 页</div>
      </div>
    </div>
    <div class="arrow-group">
      <div class="arrow">&gt;</div>
      <div class="arrow-label">自动拼版</div>
    </div>
    <div class="booklet">
      <div class="booklet-page">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
      </div>
      <div class="booklet-page">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
      </div>
    </div>
  </section>
  <div class="tag">拖入 PDF · 自动拼版 · 双面打印</div>
</body>
</html>
