<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>实时预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #1a2a5e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 3% 4% 3%;
    }
    .header { text-align: center; margin-bottom: 1.5%; }
    .brand {
      font-size: clamp(12px, 1.4vmin, 20px);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 0.4%;
    }
    h1 {
      font-size: clamp(36px, 6.2vmin, 90px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: clamp(14px, 2vmin, 28px);
      font-weight: 400;
      opacity: 0.65;
      margin-top: 0.8%;
    }
    .visual {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5%;
    }
    .tabs {
      display: flex;
      gap: clamp(3px, 0.5vmin, 6px);
      justify-content: center;
    }
    .tab {
      padding: clamp(4px, 0.6vmin, 8px) clamp(8px, 1.2vmin, 18px);
      border-radius: 14px;
      font-size: clamp(11px, 1.3vmin, 17px);
      font-weight: 500;
      opacity: 0.35;
      background: rgba(255,255,255,0.05);
      white-space: nowrap;
    }
    .tab.active {
      opacity: 1;
      background: #4a6fd4;
    }
    .preview-area {
      width: clamp(400px, 52vmin, 680px);
      height: clamp(260px, 34vmin, 440px);
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .booklet-preview {
      display: flex;
      gap: 2px;
      width: 74%;
      height: 80%;
    }
    .preview-page {
      flex: 1;
      background: #f8f9fc;
      border-radius: 5px;
      padding: 9% 8%;
      display: flex;
      flex-direction: column;
      gap: 3%;
      position: relative;
    }
    .preview-page .line {
      height: 2.5px;
      background: #6a7a92;
      border-radius: 1px;
      width: 76%;
    }
    .preview-page .line:nth-child(even) { width: 60%; }
    .preview-page .page-num {
      position: absolute;
      bottom: 3.5%;
      right: 5%;
      font-size: clamp(10px, 1.1vmin, 15px);
      color: #5a6a82;
      font-weight: 600;
    }
    .binding-line {
      position: absolute;
      left: 50%;
      top: 5%;
      bottom: 5%;
      width: 2px;
      background: #b8c0d4;
      transform: translateX(-50%);
    }
    .stage-info {
      display: flex;
      gap: clamp(10px, 1.4vmin, 20px);
      font-size: clamp(12px, 1.4vmin, 18px);
      opacity: 0.5;
    }
    .stage-info span {
      white-space: nowrap;
    }
    .stage-info .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4a6fd4;
      margin-right: 4px;
      vertical-align: middle;
    }
    .tag {
      text-align: center;
      margin-top: 1.5%;
      font-size: clamp(13px, 1.8vmin, 22px);
      font-weight: 500;
      opacity: 0.5;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <section class="header">
    <div class="brand">BookletMaker</div>
    <h1>实时预览</h1>
    <div class="subtitle">四阶段可视化，每一步都清晰可见</div>
  </section>
  <section class="visual">
    <div class="tabs">
      <div class="tab">原始 PDF</div>
      <div class="tab active">转换后</div>
      <div class="tab">装订前</div>
      <div class="tab">装订后</div>
    </div>
    <div class="preview-area">
      <div class="booklet-preview">
        <div class="preview-page">
          <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
          <div class="page-num">第 1 页</div>
        </div>
        <div class="binding-line"></div>
        <div class="preview-page">
          <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
          <div class="page-num">第 8 页</div>
        </div>
      </div>
    </div>
    <div class="stage-info">
      <span><span class="dot"></span>A4 输出</span>
      <span><span class="dot"></span>2 张纸</span>
      <span><span class="dot"></span>4 个打印面</span>
    </div>
  </section>
  <div class="tag">所见即所得 · 导出前确认效果</div>
</body>
</html>
