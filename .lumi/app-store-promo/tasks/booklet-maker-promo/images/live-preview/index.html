<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>实时预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #1a2a5e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 5% 5% 5%;
    }
    .header { text-align: center; margin-bottom: 2%; }
    .brand {
      font-size: clamp(14px, 1.8vmin, 24px);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 0.5%;
      color: #4A90E2;
    }
    h1 {
      font-size: clamp(48px, 8vmin, 100px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .subtitle {
      font-size: clamp(16px, 2.2vmin, 30px);
      font-weight: 400;
      opacity: 0.85;
      margin-top: 0.6%;
    }
    .visual {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5%;
    }
    .tabs {
      display: flex;
      gap: clamp(3px, 0.5vmin, 6px);
      justify-content: center;
    }
    .tab {
      padding: clamp(5px, 0.7vmin, 10px) clamp(10px, 1.4vmin, 22px);
      border-radius: 16px;
      font-size: clamp(12px, 1.4vmin, 18px);
      font-weight: 600;
      opacity: 0.5;
      background: rgba(255,255,255,0.06);
      white-space: nowrap;
    }
    .tab.active {
      opacity: 1;
      background: #4A90E2;
      box-shadow: 0 2px 10px rgba(74, 144, 226, 0.4);
    }
    .preview-area {
      width: clamp(440px, 56vmin, 720px);
      height: clamp(290px, 38vmin, 490px);
      background: linear-gradient(145deg, #ffffff 0%, #f8f9fc 100%);
      border-radius: 14px;
      box-shadow: 0 14px 44px rgba(0,0,0,0.4), 0 0 28px rgba(74, 144, 226, 0.12), inset 0 1px 0 rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .booklet-preview {
      display: flex;
      gap: 2px;
      width: 74%;
      height: 80%;
    }
    .preview-page {
      flex: 1;
      background: linear-gradient(180deg, #f0f2f8 0%, #e8ebf4 100%);
      border-radius: 6px;
      padding: 9% 8%;
      display: flex;
      flex-direction: column;
      gap: 3%;
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
    }
    .preview-page .line {
      height: 2.5px;
      background: #6a7a92;
      border-radius: 1px;
      width: 76%;
    }
    .preview-page .line:nth-child(even) { width: 60%; }
    .preview-page .line:nth-child(3n) { width: 45%; }
    .preview-page .header-line {
      height: 4px;
      background: #4A90E2;
      border-radius: 2px;
      width: 50%;
      margin-bottom: 6%;
    }
    .preview-page .page-num {
      position: absolute;
      bottom: 4%;
      right: 6%;
      font-size: clamp(11px, 1.3vmin, 17px);
      color: #4A90E2;
      font-weight: 700;
      background: rgba(74, 144, 226, 0.1);
      padding: 2px 8px;
      border-radius: 8px;
    }
    .binding-line {
      position: absolute;
      left: 50%;
      top: 5%;
      bottom: 5%;
      width: 3px;
      background: linear-gradient(to bottom, transparent, #4A90E2, transparent);
      transform: translateX(-50%);
    }
    .stage-info {
      display: flex;
      gap: clamp(14px, 1.8vmin, 24px);
      font-size: clamp(13px, 1.6vmin, 20px);
      opacity: 0.8;
    }
    .stage-info span {
      white-space: nowrap;
    }
    .stage-info .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4A90E2;
      margin-right: 5px;
      vertical-align: middle;
      box-shadow: 0 0 8px rgba(74, 144, 226, 0.5);
    }

    .tag {
      text-align: center;
      margin-top: 2.5%;
      font-size: clamp(15px, 2vmin, 26px);
      font-weight: 700;
      opacity: 1;
      letter-spacing: 0.05em;
      color: #4A90E2;
      background: rgba(74, 144, 226, 0.12);
      padding: 10px 28px;
      border-radius: 22px;
      display: inline-block;
      align-self: center;
      border: 1px solid rgba(74, 144, 226, 0.25);
    }
  </style>
</head>
<body>
  <section class="header">
    <div class="brand">BookletMaker</div>
    <h1>实时预览</h1>
    <div class="subtitle">四阶段可视化，每一步都清晰可见</div>
  </section>
  <section class="visual">
    <div class="tabs">
      <div class="tab">原始 PDF</div>
      <div class="tab active">转换后</div>
      <div class="tab">装订前</div>
      <div class="tab">装订后</div>
    </div>
    <div class="preview-area">
      <div class="booklet-preview">
        <div class="preview-page">
          <div class="header-line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
          <div class="page-num">第 1 页</div>
        </div>
        <div class="binding-line"></div>
        <div class="preview-page">
          <div class="header-line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
          <div class="page-num">第 8 页</div>
        </div>
      </div>
    </div>
    <div class="stage-info">
      <span><span class="dot"></span>A4 输出</span>
      <span><span class="dot"></span>2 张纸</span>
      <span><span class="dot"></span>4 个打印面</span>
    </div>
  </section>
  <div style="text-align: center;"><div class="tag">四阶段流程 · 所见即所得</div></div>
</body>
</html>
