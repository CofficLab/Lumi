# ============================================================
# Xcode Cloud Workflow Configuration for AppIconDesigner
# ============================================================
# 此文件声明了 Xcode Cloud 构建流程的完整定义。
# - 需要在 App Store Connect → Xcode Cloud 中将仓库关联为 Product
#   并完成一次"同步"操作,Xcode Cloud 才会读取此文件。
# - CI 脚本位于 ci_scripts/ 目录,会在每个工作流执行前自动运行。
# ============================================================

version: 1

# ----------------------------------------------------------
# 全局环境变量 (所有 Workflow 共享)
# ----------------------------------------------------------
env:
  # 避免 xcodebuild 长时间等待模拟器
  - isSecret: false
    value: "CI=true"
  # 避免 Xcode Cloud 超时警告 (macOS 构建耗时较长)
  - isSecret: false
    value: "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer"

# ----------------------------------------------------------
# 工作流定义
# ----------------------------------------------------------
workflows:
  # ------------------------------------------------------
  # 1) Pull Request Build & Test
  #    触发: 所有 PR 合并到 main 时执行
  #    目的: 验证代码通过编译并通过单元测试
  # ------------------------------------------------------
  "PR Build & Test":
    name: "PR Build & Test"
    description: >
      在 Pull Request 合并到 main 时触发。
      执行 Debug 构建 + 单元测试,确保代码可正常编译并通过测试。
      不产生 archive,专注于快速反馈。
    triggers:
      - pullRequest:
          branches:
            - main
    actions:
      # 调试构建:验证代码能编译通过
      - kind: build
        scheme: AppIconDesigner
        configuration: Debug
        platform: macOS

      # 单元测试:运行 AppIconDesignerPlugin 内的所有测试
      - kind: test
        scheme: AppIconDesigner
        configuration: Debug
        platform: macOS
        # 无显式 testPlan:使用 scheme 内置 test plan
        # containers=1:串行执行,macOS CI 环境资源有限
        containers: 1

  # ------------------------------------------------------
  # 2) Release Build, Test & Archive
  #    触发: release/* 或 main 分支上的 Release 推送
  #    目的: 完整构建 + 测试,生成可分发的 .app 并上传 App Store Connect
  # ------------------------------------------------------
  "Release Build":
    name: "Release Build"
    description: >
      在 release/* 分支推送或 main 分支的 Release 标签时触发。
      执行完整的 Release 构建 + 单元测试 + Archive。
      Archive 成功后自动上传至 App Store Connect (TestFlight/直接分发)。
    triggers:
      # release/* 分支上的任何提交
      - branch:
          pattern: "release/*"
      # 可选:在 App Store Connect 中额外配置 tag trigger,
      # 监听 v[0-9]* 格式的 tag 并指向此 workflow
      # - tag:
      #     pattern: "v[0-9]*"

    actions:
      # Release 构建:完整优化编译
      - kind: build
        scheme: AppIconDesigner
        configuration: Release
        platform: macOS

      # Release 配置下的单元测试(确保优化后代码同样通过测试)
      - kind: test
        scheme: AppIconDesigner
        configuration: Release
        platform: macOS
        containers: 1

      # Archive:生成可分发的 .app 包
      - kind: archive
        scheme: AppIconDesigner
        configuration: Release
        platform: macOS
        # 导出选项:自定义导出 plist 可在此指定
        # exportOptionsPlist: ci_scripts/export_options.plist

    # 构建成功后的后续动作
    postActions:
      # 上传到 App Store Connect (TestFlight / App Store)
      # 注意:需要在 App Store Connect 的 App Store Connect Workflows 页面
      # 为此 App 配置好 distribution 证书和 profile。
      - kind: app-store-connect
        #distribution: testflight  # 上传到 TestFlight
        #distribution: app-store   # 上传到 App Store (需准备好 App Store 记录)
        # 若同时支持两者,可在 App Store Connect UI 中配置分发规则。
        # isSecret: true 的字段引用 App Store Connect 中定义的 Secret Reference
        # team: ${MY_TEAM_ID}       # 替换为你在 App Store Connect 的 Team ID 或 Secret Reference
